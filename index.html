<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML 파일 실행기</title><style>
:root{--bg:#eef3f6;--card:#fff;--ink:#1b2a35;--sub:#5c6f7c;--line:#cfdbe3;--acc:#1f5f8b;--no:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--card:#18232b;--ink:#e6eef3;--sub:#93a6b3;--line:#2b3b46;--acc:#6db3e3;--no:#f08b82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181e;--card:#18232b;--ink:#e6eef3;--sub:#93a6b3;--line:#2b3b46;--acc:#6db3e3;--no:#f08b82;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#home{max-width:520px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;margin:8px 0 4px}
p{color:var(--sub);margin:4px 0 16px}
.pick{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.pick:focus-visible,.back:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#err{color:var(--no);margin-top:12px}
#view{display:none;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.back{padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
#name{color:var(--sub);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fr{flex:1;width:100%;border:0;background:#fff}
</style></head><body>
<div id="home">
<h1>HTML 파일 실행기</h1>
<p>.html 파일을 고르면 바로 실행해서 보여줘요. 파일은 이 기기에서만 읽고 어디에도 올리지 않아요.</p>
<button class="pick" id="pick">HTML 파일 선택</button>
<input type="file" id="f" accept=".html,.htm,text/html" style="display:none">
<div id="err"></div>
</div>
<div id="view"><div class="top"><button class="back" id="back">다른 파일</button><span id="name"></span></div>
<iframe id="fr" title="실행 화면" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var f=$("f"),home=$("home"),view=$("view"),fr=$("fr"),err=$("err"),hasFile=false;
$("pick").onclick=function(){f.click()};
f.onchange=function(){
 err.textContent="";
 var file=f.files&&f.files[0];
 if(!file)return;
 var r=new FileReader();
 r.onerror=function(){err.textContent="파일을 읽지 못했어요. 다시 선택해 주세요."};
 r.onload=function(){
  fr.srcdoc=String(r.result);
  $("name").textContent=file.name;
  hasFile=true;
  if(location.hash==="#run")route();else location.hash="run";
 };
 r.readAsText(file,"utf-8");
};
function route(){
 try{
  if(location.hash==="#run"&&hasFile){home.style.display="none";view.style.display="flex";return}
  fr.srcdoc="";hasFile=false;f.value="";view.style.display="none";home.style.display="block";
  if(location.hash!=="#home")location.hash="home";
 }catch(e){}
}
$("back").onclick=function(){if(location.hash==="#run")history.back();else route()};
window.addEventListener("hashchange",route);
route();
})();
</script></body></html>
